# Holt täglich den signierten Kopf-Hash von swarvex und hält ihn in der Git-Historie dieses Repos fest.
# Weicht die Kette der Plattform von früher verankerten Köpfen ab, wird der Lauf rot.
name: Anker
on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  anker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node anker.mjs
        env:
          BASIS: https://swarvex.ai
      - name: Neuen Kopf festhalten
        run: |
          git config user.name "swarvex-anker"
          git config user.email "anker@users.noreply.github.com"
          git add koepfe.jsonl
          git diff --cached --quiet || (git commit -m "Kopf $(tail -1 koepfe.jsonl | cut -c1-40)" && git push)
