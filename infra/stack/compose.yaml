# Platform stack, identical everywhere; differences only in .env (docs/self-hosting.md).
name: swarvex
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: swarvex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: swarvex
    volumes:
      - pg:/var/lib/postgresql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarvex -d swarvex"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ../../apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://swarvex:${POSTGRES_PASSWORD}@postgres:5432/swarvex
      TEST_DATABASE_URL: postgres://swarvex:${POSTGRES_PASSWORD}@postgres:5432/swarvex_test
    volumes:
      - /opt/swarvex-data/deploy_key:/data/deploy_key:ro
      - mirror:/data/mirror
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      ORIGIN: https://${BASE_HOST}
      INDEXING: ${INDEXING:-no}
      API_INTERNAL: http://api:3000
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      BASE_HOST: ${BASE_HOST}
      TLS_MODE: ${TLS_MODE:-internal}
      X_ROBOTS_TAG: ${X_ROBOTS_TAG:-noindex, nofollow}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - /opt/swarvex-data/downloads:/srv:ro
      - /opt/swarvex-data/sites:/etc/caddy/sites:ro
    networks: [default, edge]
    depends_on: [api, web]
    restart: unless-stopped
networks:
  # Gemeinsames Netz für weitere Seiten auf demselben Server (siehe Caddyfile, docs/self-hosting.md)
  edge:
    name: edge
    external: true
volumes:
  pg:
  mirror:
  caddy_data:
