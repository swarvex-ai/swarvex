# Platform stack, identical everywhere; differences only in .env (docs/self-hosting.md).
name: swarvex
services:
  postgres:
    image: postgres:18
    # Memory for database pages: Postgres' default (128MB) unless PG_SHARED_BUFFERS in .env says otherwise (live 2GB
    # since 11 Nov 2026, headroom for growth; the database had 44 MB then). Changing it restarts Postgres.
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-128MB}"]
    environment:
      POSTGRES_USER: swarvex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: swarvex
    volumes:
      - pg:/var/lib/postgresql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    # analytics: only Grafana (infra/monitoring) reads from here, as role analytik_leser on the analytik views
    networks: [default, analytics]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarvex -d swarvex"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ../../apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://swarvex:${POSTGRES_PASSWORD}@postgres:5432/swarvex
      TEST_DATABASE_URL: postgres://swarvex:${POSTGRES_PASSWORD}@postgres:5432/swarvex_test
      WEB_INTERNAL: http://web:3000   # handbook (E-48): /lead/handbook.json, beim Bauen der Website erzeugt
    volumes:
      - /opt/swarvex-data/deploy_key:/data/deploy_key:ro
      - /opt/swarvex-data/github-app:/data/github-app:ro   # GitHub App: key.pem (src/github.ts)
      - mirror:/data/mirror
      - spenden:/data/spenden
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      ORIGIN: https://${BASE_HOST}
      INDEXING: ${INDEXING:-no}
      API_INTERNAL: http://api:3000
      # Besucheradresse aus dem Kopf, den Caddy setzt (fremde Werte überschreibt Caddy); geht beim Rendern an die API
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "8444:8444"]
    environment:
      BASE_HOST: ${BASE_HOST}
      VORSCHAU_ADRESSE: ${VORSCHAU_ADRESSE:-}
      VORSCHAU_DOMAIN: ${VORSCHAU_DOMAIN:-}
      TLS_MODE: ${TLS_MODE:-internal}
      X_ROBOTS_TAG: ${X_ROBOTS_TAG:-noindex, nofollow}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - /opt/swarvex-data/downloads:/srv:ro
      - /opt/swarvex-data/sites:/etc/caddy/sites:ro
      # Vorschauen aus der Prüfstraße (nur lesend; leer, solange keine gebaut wurde)
      - /var/lib/swarvex-pipeline/vorschau:/vorschau:ro
    networks: [default, edge]
    depends_on: [api, web]
    restart: unless-stopped
networks:
  # Gemeinsames Netz für weitere Seiten auf demselben Server (siehe Caddyfile, docs/self-hosting.md)
  edge:
    name: edge
    external: true
  # Internes Netz Grafana ↔ PostgreSQL für die Auswertung (infra/analytics-setup.sh)
  analytics:
    name: analytics
    external: true
volumes:
  pg:
  mirror:
  spenden:
  caddy_data:
