apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
  # Bereich „Betrieb“: Leads und Moderation sowie Marketing und Besucher; derselbe Leser ohne personenbezogene Daten
  # wie im Bereich „Marketing“ (dort legt infra/grafana-setup.sh die Quelle an)
  - name: Analytik
    uid: analytik
    orgId: 1
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: analytik_leser
    jsonData:
      database: swarvex
      sslmode: disable
      postgresVersion: 1500
      timeInterval: 1h
    secureJsonData:
      password: $__file{/run/secrets/analytics_db}
