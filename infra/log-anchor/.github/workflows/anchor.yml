# Fetches swarvex's signed head hash every day and keeps it in this repository's Git history.
# If the platform's chain deviates from earlier anchored heads, the run turns red.
name: Anchor
on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node anchor.mjs
        env:
          BASE: https://swarvex.ai
      - name: Keep the new head
        run: |
          git config user.name "swarvex-anchor"
          git config user.email "anchor@users.noreply.github.com"
          git add heads.jsonl
          git diff --cached --quiet || (git commit -m "Kopf $(tail -1 heads.jsonl | cut -c1-40)" && git push)
