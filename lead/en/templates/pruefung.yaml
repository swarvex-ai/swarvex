# Example test contract (Godot game). Lives as pruefung.yaml in the project repository, protected path.
# Principle: deterministic, fast (< 10 min), meaningful. Fix flaky steps immediately. Keys are German because the test pipeline reads them.
engine: godot-4.7
schritte:
  - name: import
    run: godot --headless --import
    fehler_bei_warnung: true
  - name: lint
    run: gdlint src tests
  - name: tests
    run: tools/run_tests.sh --headless
  - name: vertraege
    run: tools/run_tests.sh --headless tests/vertraege
  - name: screenshots
    run: tools/capture.sh            # fixed camera, fixed lighting, fixed seed
    artefakte: [outputs/screens/*.png]
  - name: messung
    run: tools/measure.sh            # e.g. frame time with 50 enemies, load time
    artefakte: [outputs/messung.json]
    grenzen: {frame_ms_p95: 8, ladezeit_ms: 200}
pfade_geschuetzt:
  - pruefung.yaml
  - AGENTS.md
  - LICENSE*
  - project.godot
  - tools/**
  - tests/vertraege/**
  - .github/**
  - .forgejo/**
grenzen:
  zeilen: 500
  dateien: 20
  dateigroesse_mb: 10
