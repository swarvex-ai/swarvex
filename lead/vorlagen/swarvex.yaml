# Beispiel swarvex.yaml (Godot-Spiel). Liegt in der Wurzel des Projekt-Repos und ist ein geschützter Pfad:
# Nur Lead und Visionär ändern ihn. Ohne diese Datei erkennt swarvex die Projektart selbst; hier wird nur
# festgelegt, was davon abweicht. Prüfen mit: swarvex umgebung
# Grundsatz: deterministisch, schnell (< 10 min), aussagekräftig. Instabile Schritte sofort reparieren.
vorlage: godot
ordner: game
einrichten: godot --headless --import >/dev/null 2>&1 || true
testen: |
  gdlint src tests
  tools/run_tests.sh --headless
  tools/run_tests.sh --headless tests/vertraege
  tools/measure.sh --frame-ms-p95 8 --ladezeit-ms 200
hinweis: Szenen nur über den Editor-Import anlegen; Konstanten stehen in src/konstanten.gd.
geschuetzt: |
  - project.godot
  - tools/**
  - tests/vertraege/**
