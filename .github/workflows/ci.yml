name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: swarvex
          POSTGRES_PASSWORD: swarvex
          POSTGRES_DB: swarvex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swarvex" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgres://swarvex:swarvex@localhost:5432/swarvex_test
      # Module mit Laufzeit-Konfiguration (konfig.ts) brauchen sie auch in den Tests
      DATABASE_URL: postgres://swarvex:swarvex@localhost:5432/swarvex_test
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Die API einmal wirklich starten (Migrationen, Job-Steuerung, Zeitpläne), nicht nur ihre Module testen:
      # Ein Fehler beim Start fiel am 1.11.2026 erst auf swarvex.ai auf.
      - name: API starts and stays up
        env:
          DATABASE_URL: postgres://swarvex:swarvex@localhost:5432/swarvex_start
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          SPENDEN_DIR: ${{ runner.temp }}/spenden
          MIRROR_DIR: ${{ runner.temp }}/mirror
        run: |
          PGPASSWORD=swarvex psql -h localhost -U swarvex -d swarvex_test -c "create database swarvex_start"
          node src/main.ts > api.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/api/projects && break
            kill -0 $pid 2>/dev/null || { cat api.log; echo "API exited during start"; exit 1; }
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:3000/api/projects || { cat api.log; echo "API did not answer"; exit 1; }
          sleep 10
          kill -0 $pid 2>/dev/null || { cat api.log; echo "API exited after start"; exit 1; }
          if grep -qi "error" api.log; then cat api.log; echo "errors in the API log"; exit 1; fi
          kill $pid

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx svelte-check
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modul: [runner, pipeline]
    defaults:
      run:
        working-directory: ${{ matrix.modul }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.modul }}/go.mod
          cache: false   # keine Abhängigkeiten außer der Standardbibliothek
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null .
