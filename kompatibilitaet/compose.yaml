# Testinstanz für den Agenten-Kompatibilitätstest (agenten.py), getrennt vom Labor-Stack:
# eigene Datenbank, Konto-Anbieter-Attrappe statt Gitea. Alles im Host-Netz der VM; der
# Arbeitsrechner erreicht es per SSH-Tunnel als http://localhost:3800 (MCP erlaubt HTTP nur auf localhost).
# Start: docker compose -p kompat -f kompatibilitaet/compose.yaml up -d --build
name: kompat
services:
  pg:
    image: postgres:18
    network_mode: host
    environment: { POSTGRES_PASSWORD: kompat, PGPORT: "55432" }
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    tmpfs: [/var/lib/postgresql]
    healthcheck: { test: ["CMD", "pg_isready", "-p", "55432"], interval: 2s, retries: 30 }
  konto:
    image: python:3.13-slim
    network_mode: host
    volumes: [./konto_attrappe.py:/konto_attrappe.py:ro]
    command: ["python", "/konto_attrappe.py", "3999"]
  api:
    build: ../apps/api
    network_mode: host
    environment:
      DATABASE_URL: postgres://postgres:kompat@127.0.0.1:55432/postgres
      BASIS_URL: http://localhost:3800
      PORT: "3800"
      GITEA_URL: http://localhost:3999
      GITEA_CLIENT_ID: kompat
      GITEA_CLIENT_SECRET: kompat
      GITEA_TITEL: Testkonto
    depends_on:
      pg: { condition: service_healthy }
